# ==============================================================================
# Task 1 Part B - Experiment Group 3 Configuration: SGD + Momentum (LR=0.0001)
# CIFAR-10 Baseline CNN (No Dropout, No BatchNorm, No L1/L2, No Augmentation)
# ==============================================================================

experiment_name: "opt_sgd_lr_0001"
experiment_group: "optimization_study"
optimizer_name: "sgd"
seed: 42

dataset:
  name: "cifar10"
  image_shape: [32, 32, 3]
  num_classes: 10
  batch_size: 64
  # Frozen split counts (out of 50k original training images)
  train_samples: 40000
  val_samples: 10000
  test_samples: 10000
  split_file: "data/splits/cifar10_split_indices.json"

model:
  architecture: "baseline_cifar10_cnn"
  in_shape: [32, 32, 3]
  num_classes: 10
  regularization: "none"
  dropout_rate: 0.0
  batch_normalization: false
  l1_reg: 0.0
  l2_reg: 0.0

training:
  epochs: 30
  initial_lr: 0.0001
  learning_rate: 0.0001
  optimizer: "sgd"
  momentum: 0.9
  nesterov: false
  loss: "sparse_categorical_crossentropy"
  metrics: ["accuracy"]
  early_stopping: false
  lr_schedule: false
  test_evaluation_performed: false
  test_set_isolated: true
  checkpoint_metric: "val_accuracy"
  checkpoint_mode: "max"
  checkpoint_filename: "opt_sgd_lr_0001_cifar10_best.keras"
  csv_log_filename: "opt_sgd_lr_0001_training_log.csv"
  history_filename: "opt_sgd_lr_0001_training_history.json"
  summary_filename: "opt_sgd_lr_0001_experiment_summary.json"
  curves_filename: "opt_sgd_lr_0001_training_curves.png"
