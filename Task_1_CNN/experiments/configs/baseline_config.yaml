# ==============================================================================
# Baseline Experiment Configuration: Adapted AlexNet on CIFAR-10
# TensorFlow / Keras Implementation
# ==============================================================================

experiment_name: "baseline_alexnet_cifar10_v1"
seed: 42

dataset:
  name: "cifar10"
  image_shape: [32, 32, 3]
  num_classes: 10
  batch_size: 64
  # Split counts (out of 50k original training images)
  train_samples: 40000
  val_samples: 10000
  test_samples: 10000
  split_file: "data/splits/split_indices.json"

model:
  architecture: "AdaptedAlexNet"
  in_shape: [32, 32, 3]
  num_classes: 10
  dropout_rate: 0.4
  l2_reg: 0.0001

training:
  # Fixed epoch budget across experiments
  epochs: 30
  initial_lr: 0.001
  optimizer: "adam"
  lr_schedule:
    type: "reduce_on_plateau"
    factor: 0.5
    patience: 4
    min_lr: 1e-6
  checkpoint_metric: "val_loss"
  checkpoint_mode: "min"
