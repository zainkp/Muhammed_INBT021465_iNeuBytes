# ==============================================================================
# Task 1 Part B - Experiment 1B Configuration: Baseline + Batch Normalization ONLY
# TensorFlow / Keras Implementation
# ==============================================================================

experiment_name: "batchnorm_cifar10"
experiment_type: "normalization"
seed: 42

dataset:
  name: "cifar10"
  image_shape: [32, 32, 3]
  num_classes: 10
  batch_size: 64
  # Frozen split counts (out of 50k original training images)
  train_samples: 40000
  val_samples: 10000
  test_samples: 10000
  split_file: "data/splits/cifar10_split_indices.json"

model:
  architecture: "batchnorm_cifar10_cnn"
  in_shape: [32, 32, 3]
  num_classes: 10
  regularization: "none"
  dropout_rate: 0.0
  batch_normalization: true
  num_bn_layers: 6
  bn_topology: "Conv2D/Dense -> BatchNormalization -> ReLU"
  l1_reg: 0.0
  l2_reg: 0.0

training:
  # Fixed epoch budget across experiments
  epochs: 30
  initial_lr: 0.001
  optimizer: "adam"
  loss: "sparse_categorical_crossentropy"
  metrics: ["accuracy"]
  early_stopping: false
  lr_schedule: false
  checkpoint_metric: "val_accuracy"
  checkpoint_mode: "max"
  checkpoint_filename: "batchnorm_cifar10_best.keras"
  csv_log_filename: "batchnorm_training_log.csv"
  history_filename: "batchnorm_training_history.json"
